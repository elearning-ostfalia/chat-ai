<VirtualHost *:80>
    ServerName @@SERVERNAME@@
#
#    # Weiterleitung auf HTTPS empfehlenswert
    Redirect permanent / https://@@SERVERNAME@@/
</VirtualHost>


<VirtualHost *:443>
    DocumentRoot "/var/www/html"
    ServerName @@SERVERNAME@@

    SSLEngine on

    SSLCertificateFile "/etc/ssl/certs/@@SERVERNAME@@.crt"
    SSLCertificateKeyFile "/etc/ssl/certs/@@SERVERNAME@@.key"

    OIDCClientID "@@OIDC_CLIENT_ID@@"
    OIDCClientSecret "@@OIDC_SECRET@@"
    OIDCRedirectURI https://@@SERVERNAME@@/yyy
    OIDCCryptoPassphrase "fRYxppl2vzcizPAEdLgmYHvZzfaOL2Jn37ENoRRdqwc="

    # OpenID Connect Konfiguration
    # OIDCProviderMetadataURL "http://keycloak:8080/realms/chatai-realm/.well-known/openid-configuration"

    # Externe Endpunkte
    OIDCProviderIssuer                  @@OIDC_PROVIDER@@
    OIDCProviderAuthorizationEndpoint   @@OIDC_PROVIDER@@/protocol/openid-connect/auth
    # interne Endpunkte
#    OIDCProviderTokenEndpoint           http://keycloak:8080/realms/chatai-realm/protocol/openid-connect/token
#    OIDCProviderUserInfoEndpoint        http://keycloak:8080/realms/chatai-realm/protocol/openid-connect/userinfo
#    OIDCProviderJWKSUri                 http://keycloak:8080/realms/chatai-realm/protocol/openid-connect/certs
#    OIDCProviderEndSessionEndpoint      http://keycloak:8080/realms/chatai-realm/protocol/openid-connect/logout

    # maps the preferred_username claim to the REMOTE_USER environment variable
    #OIDCRemoteUserClaim preferred_username

    # Optionale Konfiguration z.B. für Cookies, Claims etc.
    #OIDCScope "openid email profile"
    #OIDCRemoteUserClaim sub
    #OIDCPassClaimsAs environment

    <Location />
        AuthType openid-connect
        Require valid-user
    </Location>

    <Location /yyy>
        AuthType openid-connect
        Require valid-user
    </Location>

    <Location /auth>
    </Location>

    # Optional: Weiterleitung für das Redirect-URI nach OIDC-Login
    <Location /redirect_uri>
        # genügt i.d.R.
        # Hier keine Authentifizierung oder Weiterleitung definieren!
    </Location>

    # ProxyPreserveHost On
    ProxyPass / http://front:8080/
    ProxyPassReverse / http://front:8080/


</VirtualHost>
